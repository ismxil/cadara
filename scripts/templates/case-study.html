<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A design case study from Cadara Studio.">
  <title>Case study — Cadara Studio</title>
  <link rel="icon" href="/asset/cadara-fav.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/case-study.css">
  <script src="/js/home-theme.js"></script>
  <script src="/js/case-study.js" defer></script>
  <script src="/js/home-carousel.js" defer></script>
  <script src="/js/analytics.js" defer></script>
</head>
<body class="case-study-page">
  <a class="skip-link" href="#case-content">Skip to case study</a>
  <header class="case-study-header"><a class="case-close" href="/?view=work" aria-label="Close case study and return to work"><span class="case-close-icon" aria-hidden="true"></span></a></header>
  <main id="case-content">
    <article class="case-study">
      <div class="case-resize" data-resize-side="left" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize case study from the left" aria-controls="case-content" aria-valuemin="720" aria-valuemax="1200" aria-valuenow="720" hidden><span aria-hidden="true"></span></div>
      <div class="case-resize" data-resize-side="right" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize case study from the right" aria-controls="case-content" aria-valuemin="720" aria-valuemax="1200" aria-valuenow="720" hidden><span aria-hidden="true"></span></div>
      <header class="case-introduction"></header>
      <div class="case-gallery" aria-label="Project gallery"></div>
    </article>
    <section class="case-more" aria-label="Explore more projects">
      <h2 class="visually-hidden">Explore more projects</h2>
      <div class="home-projects"><div class="home-projects-grid" tabindex="0"></div></div>
    </section>
  </main>
</body>
</html>
